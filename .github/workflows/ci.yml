name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: L0 verify
        run: pnpm verify

      - name: Console forms contract
        run: pnpm --filter @freelog-cli/cli verify:console-forms

      - name: OFF offline scenarios
        run: pnpm --filter @freelog-cli/cli verify:offline

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: L0 verify
        run: pnpm verify
